<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  
  <!-- سایه زیر کارخانه -->
  <ellipse cx="55" cy="92" rx="50" ry="6" fill="#000000" opacity="0.1" />
  
  <!-- زمین -->
  <rect x="5" y="80" width="100" height="12" rx="2" fill="#8b5cf6" opacity="0.3" />
  
  <!-- ===== ساختمان اصلی کارخانه ===== -->
  <rect x="25" y="45" width="40" height="35" rx="2" fill="#c084fc" stroke="#8b5cf6" stroke-width="1.5" />
  
  <!-- خطوط آجر روی ساختمان -->
  <line x1="25" y1="55" x2="65" y2="55" stroke="#a855f7" stroke-width="0.5" opacity="0.5" />
  <line x1="25" y1="65" x2="65" y2="65" stroke="#a855f7" stroke-width="0.5" opacity="0.5" />
  <line x1="25" y1="75" x2="65" y2="75" stroke="#a855f7" stroke-width="0.5" opacity="0.5" />
  
  <!-- در کارخانه (بزرگ) -->
  <rect x="38" y="62" width="14" height="18" rx="1.5" fill="#7c3aed" />
  <rect x="41" y="65" width="8" height="15" rx="1" fill="#6d28d9" />
  <circle cx="53" cy="72" r="1.5" fill="#fbbf24" />
  
  <!-- پنجره‌های کارخانه -->
  <rect x="30" y="50" width="6" height="6" rx="1" fill="#bfdbfe" stroke="#ffffff" stroke-width="1" />
  <rect x="54" y="50" width="6" height="6" rx="1" fill="#bfdbfe" stroke="#ffffff" stroke-width="1" />
  <rect x="30" y="58" width="6" height="6" rx="1" fill="#bfdbfe" stroke="#ffffff" stroke-width="1" />
  
  <!-- ===== دودکش کارخانه ===== -->
  <!-- دودکش اول -->
  <rect x="28" y="25" width="8" height="20" rx="1.5" fill="#a855f7" stroke="#8b5cf6" stroke-width="1" />
  <rect x="27" y="23" width="10" height="4" rx="1" fill="#8b5cf6" />
  
  <!-- دود دودکش اول -->
  <circle cx="32" cy="19" r="3" fill="#c084fc" opacity="0.6" />
  <circle cx="34" cy="14" r="2.5" fill="#c084fc" opacity="0.4" />
  <circle cx="31" cy="10" r="2" fill="#c084fc" opacity="0.2" />
  
  <!-- دودکش دوم -->
  <rect x="52" y="28" width="8" height="17" rx="1.5" fill="#a855f7" stroke="#8b5cf6" stroke-width="1" />
  <rect x="51" y="26" width="10" height="4" rx="1" fill="#8b5cf6" />
  
  <!-- دود دودکش دوم -->
  <circle cx="56" cy="22" r="2.5" fill="#c084fc" opacity="0.5" />
  <circle cx="58" cy="17" r="2" fill="#c084fc" opacity="0.3" />
  
  <!-- ===== سوله/انبار کنار کارخانه ===== -->
  <path d="M70 65 L85 65 L82 80 L70 80 Z" fill="#e9d5ff" stroke="#a855f7" stroke-width="1" />
  <path d="M70 65 L78 55 L85 65 Z" fill="#d8b4fe" stroke="#a855f7" stroke-width="1" />
  
  <!-- در سوله -->
  <rect x="74" y="70" width="6" height="10" rx="1" fill="#7c3aed" />
  
  <!-- ===== نوار نقاله (خط تولید) ===== -->
  <line x1="15" y1="78" x2="95" y2="78" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" />
  
  <!-- چرخ دنده‌های نوار نقاله -->
  <circle cx="18" cy="78" r="4" fill="#8b5cf6" stroke="#6d28d9" stroke-width="1" />
  <circle cx="92" cy="78" r="4" fill="#8b5cf6" stroke="#6d28d9" stroke-width="1" />
  
  <!-- محصولات روی نوار نقاله (جعبه‌ها) -->
  <rect x="30" y="72" width="6" height="6" rx="1" fill="#fbbf24" />
  <rect x="45" y="72" width="6" height="6" rx="1" fill="#fbbf24" />
  <rect x="60" y="72" width="6" height="6" rx="1" fill="#fbbf24" />
  <rect x="75" y="72" width="6" height="6" rx="1" fill="#fbbf24" />
  
  <!-- ===== علائم تجاری/پول (بازرگانی) ===== -->
  <!-- سکه در حال چرخش -->
  <g transform="translate(100, 50)">
    <circle cx="0" cy="0" r="8" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
    <text x="0" y="3" text-anchor="middle" font-size="7" fill="#78350f" font-weight="bold">$</text>
  </g>
  
  <!-- سکه دوم -->
  <g transform="translate(95, 65)">
    <circle cx="0" cy="0" r="5" fill="#f59e0b" stroke="#d97706" stroke-width="1" />
    <text x="0" y="2" text-anchor="middle" font-size="4" fill="#78350f">¢</text>
  </g>
  
  <!-- درصد/نمودار رشد -->
  <path d="M5 70 L12 60 L20 65 L28 55" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <circle cx="5" cy="70" r="2" fill="#fbbf24" />
  <circle cx="12" cy="60" r="2" fill="#fbbf24" />
  <circle cx="20" cy="65" r="2" fill="#fbbf24" />
  <circle cx="28" cy="55" r="2" fill="#fbbf24" />
  
</svg>