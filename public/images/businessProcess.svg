<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  
  <!-- سایه زیر مغازه -->
  <ellipse cx="50" cy="94" rx="42" ry="6" fill="#000000" opacity="0.1" />
  
  <!-- بدنه مغازه (کرم/بژ گرم) -->
  <rect x="14" y="44" width="72" height="48" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  
  <!-- آجرهای تزیینی کنار مغازه (چپ و راست) -->
  <rect x="14" y="44" width="6" height="48" rx="3" fill="#f59e0b" opacity="0.3" />
  <rect x="80" y="44" width="6" height="48" rx="3" fill="#f59e0b" opacity="0.3" />
  
  <!-- سقف (قرمز آجری گرم) -->
  <path d="M6 46 L50 18 L94 46 Z" fill="#dc2626" stroke="#b91c1c" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- کاشی‌های سقف (خطوط منحنی بامزه) -->
  <path d="M20 40 Q35 35 50 40" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6" />
  <path d="M50 40 Q65 35 80 40" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6" />
  <path d="M30 35 Q40 30 50 35" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6" />
  <path d="M50 35 Q60 30 70 35" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6" />
  
  <!-- پنجره ویترین (بزرگ و شیک) -->
  <rect x="20" y="54" width="32" height="24" rx="4" fill="#bfdbfe" stroke="#ffffff" stroke-width="2.5" />
  
  <!-- پرده‌های داخل ویترین -->
  <path d="M20 54 Q26 50 32 54" fill="#fbbf24" opacity="0.5" />
  <path d="M40 54 Q46 50 52 54" fill="#fbbf24" opacity="0.5" />
  
  <!-- اجناس داخل ویترین (چند شکل بامزه) -->
  <circle cx="28" cy="70" r="3" fill="#ef4444" />  <!-- گوجه -->
  <circle cx="28" cy="65" r="2" fill="#22c55e" />  <!-- برگ -->
  <rect x="36" y="66" width="6" height="8" rx="1" fill="#fbbf24" /> <!-- جعبه -->
  <circle cx="45" cy="72" r="3" fill="#8b5cf6" />  <!-- دایره -->
  
  <!-- تقسیمات پنجره -->
  <line x1="36" y1="54" x2="36" y2="78" stroke="#ffffff" stroke-width="2" />
  <line x1="20" y1="66" x2="52" y2="66" stroke="#ffffff" stroke-width="2" />
  
  <!-- در مغازه (با دستگیره بزرگ) -->
  <rect x="58" y="62" width="24" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <rect x="64" y="70" width="12" height="22" rx="2" fill="#f59e0b" />
  
  <!-- پنجره کوچک روی در -->
  <rect x="66" y="64" width="8" height="8" rx="1.5" fill="#bfdbfe" stroke="#ffffff" stroke-width="1.5" />
  
  <!-- دستگیره بامزه (قلبی شکل) -->
  <path d="M74 80 Q76 78 78 80 Q78 82 76 83 Q74 82 74 80 Z" fill="#dc2626" />
  
  <!-- سقف ورودی (چترمانند) -->
  <path d="M56 58 L80 58 L68 52 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1" />
  
  <!-- تابلوی مغازه -->
  <rect x="44" y="46" width="32" height="8" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1" />
  <text x="60" y="52" text-anchor="middle" font-size="5" fill="#78350f" font-weight="bold">فروشگاه</text>
  
  <!-- گلدان گل جلوی مغازه -->
  <rect x="16" y="84" width="8" height="8" rx="2" fill="#ca8a04" />
  <circle cx="18" cy="82" r="3" fill="#22c55e" />
  <circle cx="22" cy="82" r="3" fill="#22c55e" />
  <circle cx="20" cy="80" r="2" fill="#ef4444" />
  
  <!-- گلدان دوم -->
  <rect x="76" y="84" width="8" height="8" rx="2" fill="#ca8a04" />
  <circle cx="78" cy="82" r="3" fill="#22c55e" />
  <circle cx="82" cy="82" r="3" fill="#22c55e" />
  <circle cx="80" cy="80" r="2" fill="#ef4444" />
  
  <!-- ===== سکه‌های بامزه کنار مغازه ===== -->
  
  <!-- سکه اول (در حال چرخش) -->
  <g transform="rotate(-15, 105, 50)">
    <circle cx="105" cy="50" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <circle cx="105" cy="50" r="10" fill="none" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="4,2" />
    <!-- صورتک خندان روی سکه -->
    <circle cx="101" cy="48" r="1.5" fill="#78350f" />
    <circle cx="109" cy="48" r="1.5" fill="#78350f" />
    <path d="M102 53 Q105 56 108 53" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" />
  </g>
  
  <!-- سکه دوم (کوچیکتر) -->
  <g transform="rotate(10, 112, 68)">
    <circle cx="112" cy="68" r="9" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
    <text x="112" y="71.5" text-anchor="middle" font-size="8" fill="#d97706" font-weight="bold">💰</text>
  </g>
  
  <!-- سکه سوم (خیلی کوچیک و بامزه) -->
  <circle cx="98" cy="78" r="5" fill="#f59e0b" stroke="#d97706" stroke-width="1" />
  <text x="98" y="80.5" text-anchor="middle" font-size="5" fill="#78350f">✓</text>
  
  <!-- ستاره‌های برق (درخشش) -->
  <path d="M88 46 L89 44 L90 46 L89 48 Z" fill="#fbbf24" />
  <path d="M115 42 L116 40 L117 42 L116 44 Z" fill="#fbbf24" />
  <path d="M102 34 L103 32 L104 34 L103 36 Z" fill="#fbbf24" />
  
</svg>