<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 120 100" width="120" height="100">
  
  <!-- سایه -->
  <ellipse cx="50" cy="92" rx="42" ry="5" fill="#000000" opacity="0.08" />
  
  <!-- ===== خانه ===== -->
  <!-- بدنه خانه -->
  <rect x="12" y="45" width="42" height="42" rx="3" fill="#f8fafc" stroke="#4977D1" stroke-width="2" />
  
  <!-- سقف خانه -->
  <path d="M6 47 L33 20 L60 47 Z" fill="#4977D1" stroke="#3b5db0" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- دودکش -->
  <rect x="42" y="28" width="7" height="14" rx="1.5" fill="#3b5db0" />
  
  <!-- در خانه -->
  <rect x="26" y="67" width="12" height="20" rx="1.5" fill="#4977D1" />
  <circle cx="35" cy="78" r="1.5" fill="#fbbf24" />
  
  <!-- پنجره چپ -->
  <rect x="17" y="55" width="8" height="8" rx="1.5" fill="#bfdbfe" stroke="#ffffff" stroke-width="1.5" />
  <line x1="21" y1="55" x2="21" y2="63" stroke="#ffffff" stroke-width="1" />
  <line x1="17" y1="59" x2="25" y2="59" stroke="#ffffff" stroke-width="1" />
  
  <!-- پنجره راست -->
  <rect x="41" y="55" width="8" height="8" rx="1.5" fill="#bfdbfe" stroke="#ffffff" stroke-width="1.5" />
  <line x1="45" y1="55" x2="45" y2="63" stroke="#ffffff" stroke-width="1" />
  <line x1="41" y1="59" x2="49" y2="59" stroke="#ffffff" stroke-width="1" />
  
  <!-- ===== قبض (کنار خانه) ===== -->
  <g transform="translate(42  , 52)">
    <!-- کاغذ قبض -->
    <rect x="0" y="0" width="32" height="42" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    
    <!-- خطوط نوشته قبض -->
    <line x1="6" y1="8" x2="26" y2="8" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" />
    <line x1="6" y1="14" x2="22" y2="14" stroke="#d97706" stroke-width="1" stroke-linecap="round" />
    <line x1="6" y1="20" x2="24" y2="20" stroke="#d97706" stroke-width="1" stroke-linecap="round" />
    <line x1="6" y1="26" x2="18" y2="26" stroke="#d97706" stroke-width="1" stroke-linecap="round" />
    
    <!-- مبلغ قبض -->
    <text x="16" y="38" text-anchor="middle" font-size="9" fill="#d97706" font-weight="bold">$</text>
    
    <!-- خط پایین قبض -->
    <line x1="6" y1="35" x2="26" y2="35" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2,2" />
  </g>
  
</svg>