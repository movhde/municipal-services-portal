<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  
  <!-- سایه -->
  <ellipse cx="50" cy="92" rx="38" ry="5" fill="#000000" opacity="0.08" />
  
  <!-- پس زمینه مدور (اختیاری برای یکپارچگی) -->
  <circle cx="50" cy="50" r="38" fill="#f1f5f9" />
  
  <!-- صفحه/فرم (مستطیل با خطوط) -->
  <rect x="28" y="32" width="44" height="36" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  
  <!-- خطوط داخل صفحه (نمایش متن/درخواست) -->
  <line x1="36" y1="42" x2="64" y2="42" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="36" y1="50" x2="58" y2="50" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="36" y1="58" x2="52" y2="58" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  
  <!-- تاپ گوشه صفحه (کمی شبیه سند) -->
  <path d="M28 36 L32 32 L44 32 L44 36 Z" fill="#64748b" />
  
  <!-- علامت بعلاوه (برای درخواست جدید) -->
  <circle cx="72" cy="42" r="14" fill="#3b82f6" />
  <line x1="72" y1="36" x2="72" y2="48" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="66" y1="42" x2="78" y2="42" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- سه نقطه (نشان‌دهنده ادامه/سایر موارد) -->
  <circle cx="38" cy="76" r="2.5" fill="#64748b" />
  <circle cx="50" cy="76" r="2.5" fill="#64748b" />
  <circle cx="62" cy="76" r="2.5" fill="#64748b" />
  
</svg>