<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 120 100" width="120" height="100">
  
  <!-- سایه -->
  <ellipse cx="55" cy="92" rx="42" ry="5" fill="#000000" opacity="0.08" />
  
  <!-- ===== رسید ===== -->
  <g transform="translate(26, 38)">
    <!-- کاغذ رسید -->
    <rect x="0" y="0" width="38" height="48" rx="3" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" />
    
    <!-- سربرگ رسید -->
    <rect x="0" y="0" width="38" height="10" rx="3" fill="#8b5cf6" />
    <rect x="0" y="5" width="38" height="5" fill="#8b5cf6" />
    
    <!-- خطوط متن رسید -->
    <line x1="6" y1="16" x2="32" y2="16" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="6" y1="22" x2="28" y2="22" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="6" y1="28" x2="30" y2="28" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="6" y1="34" x2="24" y2="34" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- خط جداکننده -->
    <line x1="6" y1="40" x2="32" y2="40" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,2" />
    
  </g>
  
  <!-- ===== سکه (کنار رسید) ===== -->
  <g transform="translate(68, 52)">
    <!-- بدنه سکه -->
    <circle cx="0" cy="0" r="16" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    
    <!-- جزئیات سکه -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#fef3c7" stroke-width="1.5" />
    <circle cx="0" cy="0" r="7" fill="none" stroke="#d97706" stroke-width="1" opacity="0.5" />
    
    <!-- علامت دلار روی سکه -->
    <text x="0" y="4.5" text-anchor="middle" font-size="12" fill="#78350f" font-weight="bold">$</text>
    
    <!-- برق سکه -->
    <path d="M-10 -10 L-8 -13 L-6 -10" fill="#ffffff" opacity="0.6" />
    <path d="M10 10 L12 7 L14 10" fill="#ffffff" opacity="0.6" />
  </g>
  
  <!-- علامت جمع/بعلاوه بین رسید و سکه -->
  <g transform="translate(58, 68)">
    <circle cx="0" cy="0" r="8" fill="#10b981" />
    <line x1="-3" y1="0" x2="3" y2="0" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>
  
  <!-- فلش رشد (بالا) از رسید به سکه -->
  <g transform="translate(50, 35)">
    <line x1="0" y1="8" x2="0" y2="-5" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <polygon points="-3,0 0,-7 3,0" fill="#10b981" />
  </g>
  
</svg>