<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 120 100" width="120" height="100">
  
  <!-- سایه -->
  <ellipse cx="55" cy="92" rx="48" ry="6" fill="#000000" opacity="0.08" />
  
  <!-- ===== فروشگاه ===== -->
  <g transform="translate(8, 35)">
    
    <!-- سقف تخت تجاری (مغازه‌ها معمولاً سقف تخت دارند) -->
    <rect x="0" y="0" width="58" height="8" rx="2" fill="#f59e0b" />
    <rect x="0" y="0" width="58" height="3" rx="2" fill="#fbbf24" opacity="0.5" />
    
    <!-- بدنه فروشگاه -->
    <rect x="0" y="8" width="58" height="48" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- خط نمای فروشگاه (جدایی طبقات) -->
    <line x1="0" y1="30" x2="58" y2="30" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- ===== در ورودی (مرکزی - شیشه‌ای) ===== -->
    <rect x="20" y="38" width="18" height="18" rx="2" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2" />
    <line x1="29" y1="38" x2="29" y2="56" stroke="#3b82f6" stroke-width="1.5" />
    <!-- دستگیره در -->
    <circle cx="35" cy="48" r="1.5" fill="#fbbf24" />
    
    <!-- سایبان بالای در -->
    <rect x="17" y="34" width="24" height="4" rx="2" fill="#ef4444" />
    
    <!-- ===== ویترین چپ ===== -->
    <rect x="4" y="12" width="14" height="16" rx="2" fill="#bfdbfe" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="11" y1="12" x2="11" y2="28" stroke="#cbd5e1" stroke-width="1" />
    <line x1="4" y1="20" x2="18" y2="20" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- مانکن/لباس داخل ویترین چپ -->
    <circle cx="11" cy="16" r="2.5" fill="#ef4444" />
    <rect x="9" y="18" width="4" height="6" rx="1" fill="#ef4444" opacity="0.7" />
    
    <!-- ===== ویترین راست ===== -->
    <rect x="40" y="12" width="14" height="16" rx="2" fill="#bfdbfe" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="47" y1="12" x2="47" y2="28" stroke="#cbd5e1" stroke-width="1" />
    <line x1="40" y1="20" x2="54" y2="20" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- جعبه/کالا داخل ویترین راست -->
    <rect x="43" y="18" width="4" height="4" rx="0.5" fill="#10b981" />
    <rect x="49" y="16" width="3" height="6" rx="0.5" fill="#fbbf24" />
    
    <!-- ===== تابلوی فروشگاه (بالای سقف) ===== -->
    <rect x="14" y="-8" width="30" height="10" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
    <!-- علامت دلار روی تابلو (نماد تجاری) -->
    <text x="29" y="-1" text-anchor="middle" font-size="7" fill="#78350f" font-weight="bold">$</text>
    
    <!-- پایه تابلو -->
    <line x1="20" y1="-8" x2="20" y2="0" stroke="#d97706" stroke-width="1.5" />
    <line x1="38" y1="-8" x2="38" y2="0" stroke="#d97706" stroke-width="1.5" />
    
  </g>
  
  <!-- ===== قبض (کنار فروشگاه) ===== -->
  <g transform="translate(74, 48)">
    <!-- کاغذ قبض -->
    <rect x="0" y="0" width="28" height="40" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    
    <!-- سربرگ -->
    <rect x="0" y="0" width="28" height="8" rx="3" fill="#f59e0b" />
    
    <!-- خطوط -->
    <line x1="4" y1="14" x2="24" y2="14" stroke="#d97706" stroke-width="1" stroke-linecap="round" />
    <line x1="4" y1="19" x2="20" y2="19" stroke="#d97706" stroke-width="1" stroke-linecap="round" />
    <line x1="4" y1="24" x2="22" y2="24" stroke="#d97706" stroke-width="1" stroke-linecap="round" />
    <line x1="4" y1="29" x2="18" y2="29" stroke="#d97706" stroke-width="1" stroke-linecap="round" />
    
    <!-- خط جداکننده -->
    <line x1="4" y1="34" x2="24" y2="34" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2,2" />
    
    <!-- علامت دلار -->
    <text x="14" y="39" text-anchor="middle" font-size="6" fill="#d97706" font-weight="bold">$</text>
  </g>
  
  <!-- فلش بین فروشگاه و قبض -->
  <g transform="translate(68, 64)">
    <line x1="0" y1="0" x2="4" y2="0" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="2,-3 6,0 2,3" fill="#f59e0b" />
  </g>
  
  <!-- ===== سکه (پایین قبض) ===== -->
  <g transform="translate(88, 70)">
    <circle cx="0" cy="0" r="8" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
    <text x="0" y="2.5" text-anchor="middle" font-size="6" fill="#78350f" font-weight="bold">$</text>
  </g>
  
</svg>